app.jwt.expiration-ms=3600000
app.upload.dir=uploads
app.max-file-size=10485760
app.ocr.tesseract-path=tesseract
app.ocr.scheduler-delay-ms=5000
springdoc.swagger-ui.path=/swagger-ui.html
